async function auth(silent){await waitG();return new Promise((res,rej)=>{if(TOK&&Date.now()<TOKexp)return res();if(!(window.google&&google.accounts))return rej(new Error('Google sign-in did not load. Check your internet.'));
GC=google.accounts.oauth2.initTokenClient({client_id:CID(),scope:'https://www.googleapis.com/auth/drive.file',prompt:silent?'none':'',callback:r=>{if(r.error)return rej(new Error(r.error));TOK=r.access_token;TOKexp=Date.now()+(r.expires_in-120)*1000;res()},error_callback:e=>rej(new Error((e&&e.type)||'sign-in cancelled'))});GC.requestAccessToken()})}
async function gfetch(u,o={}){if(!TOK||Date.now()>=TOKexp)await auth(true);o.headers=Object.assign({Authorization:'Bearer '+TOK},o.headers||{});const r=await fetch(u,o);if(!r.ok){let t='';try{t=(await r.json()).error.message}catch(e){}throw new Error(t||('Google Drive error '+r.status))}return r}
async function drvUpload(blob,name){const ty=blob.type||'application/octet-stream';const r=await gfetch(UP+'?uploadType=resumable&fields=id',{method:'POST',headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':ty},body:JSON.stringify({name,parents:[FID]})});
const r2=await fetch(r.headers.get('Location'),{method:'PUT',headers:{'Content-Type':ty},body:blob});if(!r2.ok)throw new Error('Upload failed ('+r2.status+')');return (await r2.json()).id}

function idx(){P.forEach(p=>p.media.forEach(x=>{if(x.th)THM[x.id]=x.th}))}
async function mDel(id){idx();const t=THM[id];await gfetch(API+id,{method:'DELETE'}).catch(()=>{});if(t)await gfetch(API+t,{method:'DELETE'}).catch(()=>{})}
async function url(id){if(U[id])return U[id];try{const b=await mGet(id);if(b)return U[id]=URL.createObjectURL(b)}catch(e){}return''}

if(!r.files[0]){DFID=await drvUpload(new Blob(['{"products":[],"moves":[]}'],{type:'application/json'}),'vault-data.json');DMOD=(await(await gfetch(API+DFID+'?fields=modifiedTime')).json()).modifiedTime;return{products:[],moves:[]}}
DFID=r.files[0].id;DMOD=r.files[0].modifiedTime;return await(await gfetch(API+DFID+'?alt=media')).json()}
async function drvMerge(){const m=await(await gfetch(API+DFID+'?fields=modifiedTime')).json();if(!DMOD||m.modifiedTime<=DMOD)return false;const r=await(await gfetch(API+DFID+'?alt=media')).json(),have=new Set(P.map(p=>p.id)),gone=[...KN].filter(i=>!have.has(i)),mp=new Map(P.map(p=>[p.id,p]));
(r.products||[]).forEach(p=>{if(gone.includes(p.id))return;const o=mp.get(p.id);if(!o)P.push(p);else if((p.ut||0)>(o.ut||0))Object.assign(o,p)});const ml=new Set(L.map(l=>l.id));(r.moves||[]).forEach(l=>{if(!ml.has(l.id))L.push(l)});L.sort((a,b)=>b.t-a.t);DMOD=m.modifiedTime;return true}

L.sort((a,b)=>b.t-a.t);save();render();if(manual)toast('Demo products added')}catch(e){toast('Demo could not be added: '+(e.message||'storage problem'),1)}}
